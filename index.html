<style>
:root{

}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse at 50% -10%,var(--floor-2),transparent 65%);background-attachment:fixed;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,9vw,3rem);line-height:.95;margin:0;text-wrap:balance}
h1 .a{color:var(--a2)}
h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0;line-height:1.5}
.dim{color:var(--dim)}
.lbl{font-weight:900;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-size:1.1rem;padding:14px 20px;border:none;border-radius:12px;background:var(--a2);color:#2a1a00;box-shadow:0 5px 0 #b8861d;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861d}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--card);font-family:var(--body);font-weight:900;font-size:1rem}
.btn.wide{width:100%}
button:focus-visible,input:focus-visible{outline:3px solid var(--a4);outline-offset:3px}
input[type=text]{font:inherit;font-size:1.15rem;padding:13px 14px;border-radius:10px;border:2px solid var(--card);background:var(--well);color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--a4)}
input.code{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:1.6rem;min-width:0}
.panel{background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-weight:900;font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--well)}
.bigcode{font-family:var(--display);font-size:clamp(3rem,16vw,4.5rem);letter-spacing:.15em;text-align:center;color:var(--a2);line-height:1}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--well);border-radius:99px;padding:8px 14px;font-weight:900;display:flex;gap:6px;align-items:center}
.chip .tag{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.chip.done{box-shadow:inset 0 0 0 2px var(--good)}
.chip.off{opacity:.45}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{border:2px solid var(--well);background:var(--well);color:var(--dim);border-radius:99px;padding:8px 13px;font-weight:900;font-size:.9rem}
.cats button[aria-pressed=true]{border-color:var(--a2);color:var(--ink);background:#2a1d3f}
.cats button small{opacity:.6;font-weight:700;margin-left:4px}
.seg{display:inline-flex;background:var(--well);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;color:var(--dim);font-family:var(--display);font-size:1rem;padding:8px 13px;border-radius:9px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.timer.low{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--well);overflow:hidden}
.bar i{display:block;height:100%;background:var(--a2);transition:width .25s linear}
.catpill{display:inline-block;font-weight:900;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--a2)}
.q{font-weight:900;font-size:clamp(1.3rem,5.5vw,1.7rem);line-height:1.3;text-wrap:balance}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
.tile{border:none;border-radius:14px;padding:18px 16px;min-height:64px;text-align:left;font-weight:900;font-size:1.15rem;color:#1c1230;display:flex;gap:12px;align-items:center;touch-action:manipulation;transition:transform .06s,opacity .2s}
.tile:active{transform:scale(.98)}
.tile .k{font-family:var(--display);font-size:1rem;opacity:.7}
.tile:nth-child(1){background:var(--a1)}.tile:nth-child(2){background:var(--a2)}.tile:nth-child(3){background:var(--a3)}.tile:nth-child(4){background:var(--a4)}
.tile:disabled{cursor:default}
.tile.dim{opacity:.3}
.tile.mine{outline:4px solid var(--ink);outline-offset:3px}
.tile.right{opacity:1;box-shadow:0 0 0 4px var(--floor),0 0 0 8px var(--good)}
.tile .who{margin-left:auto;font-size:.8rem;font-weight:900;background:rgba(28,18,48,.85);color:var(--ink);padding:4px 8px;border-radius:99px;text-align:right}
.result{font-family:var(--display);font-size:1.8rem;text-align:center}
.result.good{color:var(--good)}.result.bad{color:var(--bad)}
.board{display:flex;flex-direction:column;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--well);border-radius:10px;padding:12px 14px;font-weight:900}
.li .v{font-family:var(--display);font-variant-numeric:tabular-nums}
.li .g{color:var(--good);font-size:.85rem;margin-left:6px}
.li.first{box-shadow:inset 0 0 0 2px var(--a2)}
.li.me{background:#24183e}
.waiting{text-align:center;padding-block:30px;display:flex;flex-direction:column;gap:12px;align-items:center}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--a2);animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25;transform:scale(.7)}}
.note{font-size:.85rem;color:var(--dim);line-height:1.5}
.err{color:var(--bad);font-weight:900}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const BANK=RAW.trim().split("\n").map(l=>{const [c,q,...o]=l.split("|");return{c,q,o}}).filter(x=>CATS[x.c]&&x.o.length===4);

/* ================= helpers ================= */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let AC=null;
function beep(f=660,d=.08,type="square",v=.05){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02)}catch(e){}}
let wake=null;
async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(H||conn))keepAwake()});

const PREFIX="trivia-showdown-v1-";
let pid=ls.get("ts-pid","");if(!pid){pid=Math.random().toString(36).slice(2,10);ls.set("ts-pid",pid)}
let myName=ls.get("ts-name","");
let peer=null,conn=null,H=null,S=null,code="";
let qSeen={key:"",t:0},myAns=null,ticker=null,lastSound="";

/* ================= home ================= */
function home(err){
  cleanup();
  const joinCode=(location.hash.match(/^#([A-Za-z]{4})$/)||[])[1]||"";
  app.innerHTML=`
  <header style="display:flex;flex-direction:column;gap:8px"><h1>Trivia <span class="a">Showdown</span></h1>
  <p class="dim">Everyone plays on their own phone. Same question, same moment. Right answer +1, fastest right answer +1 more.</p></header>
  <div class="panel">
    <div class="field"><span class="lbl">Your name</span><input type="text" id="nm" maxlength="14" placeholder="e.g. Nehal" value="${esc(myName)}" autocomplete="nickname"></div>
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="cd" class="code" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Game code" value="${esc(joinCode.toUpperCase())}"><button class="btn" id="join">Join</button></div>
    <div class="or">or</div>
    <button class="btn ghost wide" id="host">Host a new game</button>
    ${err?`<p class="err">${esc(err)}</p>`:""}
  </div>
  <p class="note">${BANK.length} questions across ${Object.keys(CATS).length} categories. No account or app needed. Up to 12 players.</p>`;
  const nm=document.getElementById("nm"),cd=document.getElementById("cd");
  const getName=()=>{const v=nm.value.trim();if(!v){nm.focus();nm.style.borderColor="var(--bad)";return null}myName=v;ls.set("ts-name",v);return v};
  document.getElementById("host").onclick=()=>{if(getName()){beep(880,.05);startHost()}};
  const doJoin=()=>{if(!getName())return;const c=cd.value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){cd.focus();cd.style.borderColor="var(--bad)";return}beep(880,.05);startJoin(c)};
  document.getElementById("join").onclick=doJoin;cd.onkeydown=e=>{if(e.key==="Enter")doJoin()};
  cd.oninput=()=>cd.value=cd.value.replace(/[^a-z]/gi,"").toUpperCase();
}
function cleanup(){
  clearInterval(ticker);ticker=null;
  if(H&&H.timer)clearTimeout(H.timer);
  try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}
  peer=null;conn=null;H=null;S=null;code="";myAns=null;
  try{wake&&wake.release()}catch(e){}wake=null;
}
function waitScreen(title,sub){app.innerHTML=`<div class="waiting"><div class="pulse"></div><h2>${esc(title)}</h2>${sub?`<p class="dim">${esc(sub)}</p>`:""}<button class="btn ghost" id="cancel">Cancel</button></div>`;document.getElementById("cancel").onclick=()=>home()}
function needPeer(){if(typeof Peer==="undefined"){home("Couldn't load the connection library. Check your internet and refresh.");return false}return true}

/* ================= HOST ================= */
function newCode(){const L="ABCDEFGHJKMNPQRSTUVWXYZ";return Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join("")}
function startHost(tries=0){
  if(!needPeer())return;
  code=newCode();waitScreen("Setting up your game…");
  peer=new Peer(PREFIX+code.toLowerCase(),{debug:0});
  peer.on("open",()=>{
    H={players:{},phase:"lobby",cats:new Set(JSON.parse(ls.get("ts-cats","null"))||Object.keys(CATS)),rounds:+ls.get("ts-rounds",10),dur:+ls.get("ts-dur",15),
       qs:[],qi:0,gid:"",timer:null,used:new Set(),res:null};
    H.players[pid]={name:myName,score:0,on:true,conn:null,ans:null,host:true};
    keepAwake();broadcast();
  });
  peer.on("connection",c=>{
    c.on("data",d=>hostMsg(c,d));
    c.on("close",()=>{const p=Object.values(H?H.players:{}).find(p=>p.conn===c);if(p){p.on=false;p.conn=null;broadcast();hostCheckAll()}});
    c.on("error",()=>{});
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"&&tries<4){try{peer.destroy()}catch(_){};return startHost(tries+1)}
    if(!H)home("Couldn't start a game. Check your internet and try again.");
  });
}
function hostMsg(c,d){
  if(!H||!d||typeof d!=="object")return;
  const id=String(d.pid||"").slice(0,16);if(!id)return;
  if(d.t==="join"){
    const name=String(d.name||"Player").trim().slice(0,14)||"Player";
    const live=Object.values(H.players).filter(p=>p.on).length;
    if(!H.players[id]&&live>=12){c.send({t:"full"});return}
    const p=H.players[id]||(H.players[id]={score:0,ans:null});
    p.name=name;p.conn=c;p.on=true;broadcast();
  }else if(d.t==="ans"){hostAnswer(id,d)}
}
function hostAnswer(id,d){
  const p=H.players[id];if(!p||H.phase!=="q"||d.gid!==H.gid||d.qi!==H.qi||p.ans)return;
  const k=+d.k;if(!(k>=0&&k<4))return;
  p.ans={k,ms:Math.max(0,Math.min(+d.ms||0,H.dur*1000+3000))};
  broadcast();hostCheckAll();
}
function hostCheckAll(){
  if(!H||H.phase!=="q")return;
  const live=Object.values(H.players).filter(p=>p.on);
  if(live.length&&live.every(p=>p.ans)){clearTimeout(H.timer);H.timer=setTimeout(hostReveal,500)}
}
function hostStart(){
  let pool=BANK.filter(x=>H.cats.has(x.c));
  let fresh=pool.filter(x=>!H.used.has(x.q));
  if(fresh.length<H.rounds){pool.forEach(x=>H.used.delete(x.q));fresh=pool}
  H.qs=shuffle(fresh).slice(0,H.rounds).map(x=>{H.used.add(x.q);const opts=shuffle(x.o);return{c:x.c,q:x.q,opts,correct:opts.indexOf(x.o[0])}});
  Object.values(H.players).forEach(p=>{p.score=0;p.ans=null});
  H.gid=Math.random().toString(36).slice(2,8);hostQuestion(0);
}
function hostQuestion(qi){
  clearTimeout(H.timer);H.phase="q";H.qi=qi;H.res=null;
  Object.values(H.players).forEach(p=>p.ans=null);
  broadcast();
  H.timer=setTimeout(hostReveal,(H.dur+1)*1000);
}
function hostReveal(){
  if(!H||H.phase!=="q")return;clearTimeout(H.timer);
  const Q=H.qs[H.qi],res={};
  const right=Object.entries(H.players).filter(([,p])=>p.ans&&p.ans.k===Q.correct);
  const fastest=right.length?right.reduce((a,b)=>a[1].ans.ms<=b[1].ans.ms?a:b)[0]:null;
  Object.entries(H.players).forEach(([id,p])=>{if(!p.ans)return;const gain=p.ans.k===Q.correct?(id===fastest?2:1):0;p.score+=gain;res[id]={k:p.ans.k,gain,ms:Math.round(p.ans.ms)}});
  H.res=res;H.phase="reveal";broadcast();
}
function hostNext(){if(H.qi+1>=H.qs.length){H.phase="end";broadcast()}else hostQuestion(H.qi+1)}
function hostLobby(){clearTimeout(H.timer);H.phase="lobby";Object.values(H.players).forEach(p=>{p.ans=null});broadcast()}
function hostState(){
  const players=Object.entries(H.players).map(([id,p])=>({id,name:p.name,score:p.score,on:p.on,host:!!p.host,answered:!!p.ans}));
  const s={phase:H.phase,code,players,cats:[...H.cats],rounds:H.rounds,dur:H.dur};
  if(H.phase==="q"||H.phase==="reveal"){const Q=H.qs[H.qi];Object.assign(s,{gid:H.gid,qi:H.qi,total:H.qs.length,c:Q.c,q:Q.q,opts:Q.opts})}
  if(H.phase==="reveal")Object.assign(s,{correct:H.qs[H.qi].correct,res:H.res});
  return s;
}
function broadcast(){
  if(!H)return;const s=hostState();
  Object.values(H.players).forEach(p=>{if(p.conn&&p.conn.open){try{p.conn.send({t:"state",s})}catch(e){}}});
  S=s;render();
}

/* ================= PLAYER ================= */
function startJoin(c,isRetry){
  if(!needPeer())return;
  cleanup();code=c;waitScreen(isRetry?"Reconnecting…":`Joining game ${c}…`);
  let done=false;const giveUp=setTimeout(()=>{if(!done)home(`Couldn't reach game ${c}. Check the code, and make sure the host's screen is on.`)},12000);
  peer=new Peer({debug:0});
  peer.on("open",()=>{
    conn=peer.connect(PREFIX+c.toLowerCase(),{reliable:true});
    conn.on("open",()=>{done=true;clearTimeout(giveUp);conn.send({t:"join",pid,name:myName});keepAwake();try{history.replaceState(null,"","#"+c)}catch(e){}});
    conn.on("data",d=>{if(!d)return;if(d.t==="state"){S=d.s;render()}else if(d.t==="full"){home("That game is full (12 players).")}});
    conn.on("close",()=>{if(conn&&S)lostHost()});
    conn.on("error",()=>{});
  });
  peer.on("error",e=>{if(e.type==="peer-unavailable"){done=true;clearTimeout(giveUp);home(`No game found with code ${c}. Check the code with your host.`)}});
}
function lostHost(){
  clearInterval(ticker);const c=code;
  app.innerHTML=`<div class="waiting"><h2>Lost connection to the host</h2><p class="dim">Their phone may have locked or left the page.</p>
  <button class="btn" id="re">Reconnect</button><button class="btn ghost" id="hm">Leave</button></div>`;
  document.getElementById("re").onclick=()=>startJoin(c,true);document.getElementById("hm").onclick=()=>home();
}
function sendAnswer(k){
  if(!S||S.phase!=="q")return;const key=S.gid+":"+S.qi;if(myAns&&myAns.key===key)return;
  myAns={key,k};const ms=Math.round(performance.now()-qSeen.t);beep(660,.05);
  if(H)hostAnswer(pid,{gid:S.gid,qi:S.qi,k,ms});else{try{conn.send({t:"ans",pid,gid:S.gid,qi:S.qi,k,ms})}catch(e){}render()}
}

/* ================= RENDER ================= */
const isHost=()=>!!H;
function render(){
  clearInterval(ticker);ticker=null;if(!S)return;
  ({lobby:rLobby,q:rQuestion,reveal:rReveal,end:rEnd})[S.phase]?.();
}
function board(withGain){
  const ps=S.players.slice().sort((a,b)=>b.score-a.score);const top=ps.length?ps[0].score:0;
  return `<div class="board">${ps.map(p=>{const g=withGain&&S.res&&S.res[p.id]?S.res[p.id].gain:0;
    return `<div class="li ${p.score===top&&top>0?"first":""} ${p.id===pid?"me":""}" ${p.on?"":'style="opacity:.5"'}><span>${esc(p.name)}${p.id===pid?' <span class="dim" style="font-size:.8rem">(you)</span>':""}${g?`<span class="g">+${g}</span>`:""}</span><span class="v">${p.score}</span></div>`}).join("")}</div>`;
}
function leaveBtn(){const b=document.getElementById("leave");if(b)b.onclick=()=>home()}
function rLobby(){
  qSeen={key:"",t:0};myAns=null;
  const counts={};BANK.forEach(x=>counts[x.c]=(counts[x.c]||0)+1);
  const live=S.players.filter(p=>p.on);
  const link=location.origin&&location.origin!=="null"?location.href.split("#")[0]+"#"+S.code:"";
  app.innerHTML=`
  <div class="row between"><h1 style="font-size:1.8rem">Trivia <span class="a">Showdown</span></h1><button class="btn ghost" id="leave">${isHost()?"End":"Leave"}</button></div>
  <div class="panel" style="text-align:center"><span class="lbl">Game code</span><div class="bigcode">${esc(S.code)}</div>
    <p class="dim">${isHost()?"Friends open this page, type the code and tap Join.":"You're in. Waiting for the host to start."}</p>
    ${isHost()&&link?`<button class="btn ghost" id="copy">Copy invite link</button>`:""}</div>
  <div class="panel"><span class="lbl">Players · ${live.length}</span>
    <div class="players">${S.players.map(p=>`<span class="chip ${p.on?"":"off"}">${esc(p.name)}${p.host?' <span class="tag">host</span>':""}${p.id===pid?' <span class="tag">you</span>':""}</span>`).join("")}</div></div>
  ${isHost()?`
  <div class="panel">
    <div class="row between"><span class="lbl">Categories</span><button class="btn ghost" id="all" style="padding:6px 12px;font-size:.85rem">${H.cats.size===Object.keys(CATS).length?"Clear":"All"}</button></div>
    <div class="cats">${Object.entries(CATS).map(([k,v])=>`<button data-c="${k}" aria-pressed="${H.cats.has(k)}">${esc(v)}<small>${counts[k]||0}</small></button>`).join("")}</div>
    <div class="row between"><span class="lbl">Questions</span><div class="seg">${[5,10,15,20].map(n=>`<button data-n="${n}" aria-pressed="${n===H.rounds}">${n}</button>`).join("")}</div></div>
    <div class="row between"><span class="lbl">Seconds each</span><div class="seg">${[10,15,20].map(n=>`<button data-d="${n}" aria-pressed="${n===H.dur}">${n}</button>`).join("")}</div></div>
    <button class="btn wide" id="start" ${H.cats.size?"":"disabled"}>${H.cats.size?"Start game":"Pick a category"}</button>
  </div>`:`<div class="panel"><span class="lbl">Up next</span><p>${S.rounds} questions · ${S.dur} seconds each</p><p class="dim">${S.cats.map(c=>esc(CATS[c]||c)).join(" · ")}</p></div>`}`;
  leaveBtn();
  if(isHost()){
    const save=()=>{ls.set("ts-cats",JSON.stringify([...H.cats]));ls.set("ts-rounds",H.rounds);ls.set("ts-dur",H.dur);broadcast()};
    app.querySelectorAll(".cats button").forEach(b=>b.onclick=()=>{const c=b.dataset.c;H.cats.has(c)?H.cats.delete(c):H.cats.add(c);save()});
    document.getElementById("all").onclick=()=>{H.cats=H.cats.size===Object.keys(CATS).length?new Set():new Set(Object.keys(CATS));save()};
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{H.rounds=+b.dataset.n;save()});
    app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{H.dur=+b.dataset.d;save()});
    document.getElementById("start").onclick=()=>{beep(990,.1,"triangle");hostStart()};
    const cp=document.getElementById("copy");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);cp.textContent="Copied!"}catch(e){cp.textContent=link}};
  }
}
function rQuestion(){
  const key=S.gid+":"+S.qi;
  if(qSeen.key!==key){qSeen={key,t:performance.now()};beep(880,.06)}
  const mine=myAns&&myAns.key===key?myAns:null;
  const live=S.players.filter(p=>p.on),done=live.filter(p=>p.answered);
  app.innerHTML=`
  <div class="qhead"><span class="lbl">Question ${S.qi+1} of ${S.total}</span><span class="timer" id="tl"></span></div>
  <div class="bar"><i id="tb" style="width:100%"></i></div>
  <span class="catpill">${esc(CATS[S.c]||"")}</span>
  <div class="q">${esc(S.q)}</div>
  <div class="tiles">${S.opts.map((o,k)=>`<button class="tile ${mine?(mine.k===k?"mine":"dim"):""}" data-k="${k}" ${mine?"disabled":""}><span class="k">${"ABCD"[k]}</span>${esc(o)}</button>`).join("")}</div>
  <div class="players">${live.map(p=>`<span class="chip ${p.answered?"done":""}">${esc(p.name)}${p.answered?" ✓":""}</span>`).join("")}</div>
  <p class="dim" style="text-align:center">${mine?`Locked in. ${done.length} of ${live.length} answered.`:"Tap your answer. Nobody sees picks until the reveal."}</p>
  ${isHost()?`<button class="btn ghost" id="skip" style="align-self:center">Reveal now</button>`:""}`;
  app.querySelectorAll(".tile").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();sendAnswer(+b.dataset.k)}));
  if(isHost())document.getElementById("skip").onclick=hostReveal;
  const tick=()=>{const left=Math.max(0,S.dur-(performance.now()-qSeen.t)/1000);const el=document.getElementById("tl"),bar=document.getElementById("tb");
    if(el){el.textContent=Math.ceil(left);el.classList.toggle("low",left<=5)}if(bar)bar.style.width=(left/S.dur*100)+"%"};
  tick();ticker=setInterval(tick,250);
}
function rReveal(){
  const r=S.res&&S.res[pid];let msg,cls;
  if(!r){msg="Too slow";cls="bad"}else if(r.gain===2){msg="Fastest! +2";cls="good"}else if(r.gain===1){msg="Right! +1";cls="good"}else{msg="Wrong";cls="bad"}
  const key="r"+S.gid+":"+S.qi;if(lastSound!==key){lastSound=key;beep(cls==="good"?1100:200,.15,cls==="good"?"triangle":"sawtooth")}
  const names=Object.fromEntries(S.players.map(p=>[p.id,p.name]));
  const pickers=k=>Object.entries(S.res||{}).filter(([,v])=>v.k===k).map(([id])=>names[id]||"?");
  app.innerHTML=`
  <div class="qhead"><span class="lbl">Question ${S.qi+1} of ${S.total}</span><span class="catpill">${esc(CATS[S.c]||"")}</span></div>
  <div class="q">${esc(S.q)}</div>
  <div class="result ${cls}">${msg}${r&&r.gain?` <span class="dim" style="font-size:1rem">${(r.ms/1000).toFixed(1)}s</span>`:""}</div>
  <div class="tiles">${S.opts.map((o,k)=>{const w=pickers(k);return `<button class="tile ${k===S.correct?"right":"dim"} ${r&&r.k===k?"mine":""}" disabled><span class="k">${"ABCD"[k]}</span>${esc(o)}${w.length?`<span class="who">${esc(w.join(", "))}</span>`:""}</button>`}).join("")}</div>
  <span class="lbl">Scores</span>${board(true)}
  ${isHost()?`<button class="btn wide" id="nx">${S.qi+1>=S.total?"Final results":"Next question"}</button>`:`<p class="dim" style="text-align:center">Waiting for the host…</p>`}`;
  if(isHost())document.getElementById("nx").onclick=hostNext;
}
function rEnd(){
  const ps=S.players.slice().sort((a,b)=>b.score-a.score);const top=ps.length?ps[0].score:0;
  const w=ps.filter(p=>p.score===top&&top>0).map(p=>p.name);
  const key="e"+S.gid;if(lastSound!==key){lastSound=key;beep(1200,.3,"triangle")}
  app.innerHTML=`
  <div class="panel" style="text-align:center"><span class="lbl">Game over</span>
    <h1 style="font-size:clamp(1.8rem,8vw,2.6rem)">${w.length?`${esc(w.join(" & "))} win${w.length>1?"":"s"}!`:"Nobody scored"}</h1>
    <p class="dim">${top} point${top===1?"":"s"}</p></div>
  ${board(false)}
  ${isHost()?`<div class="row"><button class="btn" id="again" style="flex:1">Play again</button><button class="btn ghost" id="leave">End</button></div>`
    :`<p class="dim" style="text-align:center">The host can start another round.</p><button class="btn ghost" id="leave">Leave</button>`}`;
  leaveBtn();if(isHost())document.getElementById("again").onclick=hostLobby;
}

home();
</script>
